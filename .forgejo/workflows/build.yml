name: Build Tankblick

on:
  push:
  pull_request:
  # So a run can be repeated after a runner or network hiccup without an
  # empty commit to trigger it.
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    # A clean build is a couple of minutes; anything near this is a hung runner
    # holding up the queue rather than a slow build.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: https://github.com/actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.gradle/caches and the wrapper distribution, keyed on the
          # build scripts. The runner has its cache server enabled, so this
          # works without an external cache backend.
          cache: gradle

      # Installs the command line tools and accepts the licences. The platform
      # and build tools themselves are left to AGP, which downloads exactly the
      # versions the build asks for instead of a list kept in sync by hand.
      - name: Set up Android SDK
        uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: ''

      # AGP pulls the compile SDK and build tools on first use, which is a
      # couple of hundred megabytes per run. Keyed on the build script, because
      # that is what names the versions being downloaded.
      - name: Cache Android SDK components
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
