name: Build Tankblick

on:
  push:
  pull_request:
  # So a run can be repeated after a runner or network hiccup without an
  # empty commit to trigger it.
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    # A clean build is a couple of minutes; anything near this is a hung runner
    # holding up the queue rather than a slow build.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: https://github.com/actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.gradle/caches and the wrapper distribution, keyed on the
          # build scripts. The runner has its cache server enabled, so this
          # works without an external cache backend.
          cache: gradle

      # Installs the command line tools and accepts the licences. The platform
      # and build tools themselves are left to AGP, which downloads exactly the
      # versions the build asks for instead of a list kept in sync by hand.
      - name: Set up Android SDK
        uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: ''

      # One invocation rather than three. The step named "run unit tests" was
      # taking five minutes for 0.6 seconds of actual tests - it was the first
      # Gradle call paying for KSP and the whole Kotlin compile. Splitting that
      # across three calls only added JVM cold starts; the configuration cache
      # already covered the rest.
      #
      # The worker count and heap override gradle.properties, which is tuned to
      # leave a desktop responsive. This container has three CPUs and four
      # gigabytes to itself and no one waiting on it. Note that overriding
      # org.gradle.jvmargs replaces the value rather than merging, so the
      # encoding has to be repeated.
      - name: Build and test
        run: >-
          ./gradlew testDebugUnitTest lint assembleDebug
          --max-workers=3
          -Dorg.gradle.jvmargs="-Xmx2560m -Dfile.encoding=UTF-8"
